name: Release WordPress Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Package, and Publish Self-Hosted Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Configuration
          PLUGIN_DIR="plugins/my-plugin"
          DIR=$(basename "$PLUGIN_DIR")
          MAIN_FILE=$(find "$PLUGIN_DIR" -maxdepth 1 -name "*.php" -exec grep -q "Plugin Name:" {} \; -print | head -n 1)
          VERSION=$(grep -i "Version:" "$MAIN_FILE" | sed -r 's/.*Version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '\r')
          TAG="$DIR/v$VERSION"
          ZIP_NAME="$DIR-v$VERSION.zip"

          echo "Plugin: $DIR, Version: $VERSION, Tag: $TAG"

          # 2. Check if already released
          git fetch --tags
          if [ -n "$(git tag -l "$TAG")" ]; then
            echo "Version $VERSION is already tagged. Skipping."
            exit 0
          fi

          # 3. Optional asset build (Gutenberg / React)
          if [ -f "$PLUGIN_DIR/package.json" ]; then
            cd "$PLUGIN_DIR"
            npm ci || npm install
            npm run build --if-present
            cd "$GITHUB_WORKSPACE"
          fi

          # 4. Generate info.json for GitHub Pages
          node scripts/generate-info-json.js \
            --dir="$PLUGIN_DIR" \
            --version="$VERSION" \
            --tag="$TAG" \
            --zip="$ZIP_NAME" \
            --repo="${{ github.repository }}" \
            --docs="$GITHUB_WORKSPACE/docs"

          # 5. Create production package folder
          BUILD_DIR="build_dir/$DIR"
          mkdir -p "$BUILD_DIR"
          cp -r "$PLUGIN_DIR"/* "$BUILD_DIR/"

          # Exclude development files (.distignore)
          if [ -f "$PLUGIN_DIR/.distignore" ]; then
            cd "$BUILD_DIR"
            while IFS= read -r line || [ -n "$line" ]; do
              [[ "$line" =~ ^# ]] && continue
              [[ -z "$line" ]] && continue
              pattern=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              find . -path "./$pattern" -exec rm -rf {} + 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/$PLUGIN_DIR/.distignore"
            cd "$GITHUB_WORKSPACE"
          fi

          # 6. Create Release ZIP (with $DIR as top-level folder)
          cd build_dir
          zip -r "../$ZIP_NAME" "$DIR"
          cd "$GITHUB_WORKSPACE"
          rm -rf build_dir

          # 7. Commit updated docs/ for GitHub Pages
          git add "docs/$DIR/info.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore($DIR): update info.json for v$VERSION [skip ci]"
            git push origin main
          fi

          # 8. Tag and create GitHub Release
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$ZIP_NAME" \
            --title="$DIR v$VERSION" \
            --notes="Release v$VERSION. See info.json for full changelog."
