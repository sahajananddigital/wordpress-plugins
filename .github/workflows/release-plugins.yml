name: Release WordPress Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  release:
    name: Auto Detect and Release Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history and tags

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scan and Release Plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all remote tags
          git fetch --tags

          # Scan all directories in the repository root
          for DIR in *; do
            # Skip if not a directory or if it is a hidden/system directory
            if [ ! -d "$DIR" ] || [[ "$DIR" == .* ]]; then
              continue
            fi

            # Find the main PHP file containing "Plugin Name:"
            MAIN_FILE=$(find "$DIR" -maxdepth 1 -name "*.php" -exec grep -q "Plugin Name:" {} \; -print | head -n 1)
            
            if [ -z "$MAIN_FILE" ]; then
              # Not a WordPress plugin
              continue
            fi

            # Extract the version number from the plugin file header
            VERSION=$(grep -i "Version:" "$MAIN_FILE" | sed -r 's/.*Version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '\r')
            
            if [ -z "$VERSION" ]; then
              echo "⚠️ Could not parse version in $MAIN_FILE. Skipping."
              continue
            fi

            # Formulate the tag name (e.g. multisite-subsite-admin-user-editor/v1.1.0)
            TAG="$DIR/v$VERSION"
            
            # Check if this version has already been tagged/released
            if [ -n "$(git tag -l "$TAG")" ]; then
              echo "✅ Plugin '$DIR' (version $VERSION) is already released (Tag: $TAG). Skipping."
              continue
            fi

            echo "🚀 New version detected! Plugin '$DIR' needs to be released at version $VERSION (Tag: $TAG)..."

            # 1. Create a clean production package
            BUILD_DIR="build_dir/$DIR"
            mkdir -p "$BUILD_DIR"
            cp -r "$DIR"/* "$BUILD_DIR/"
            
            # Remove testing and development configuration files
            rm -rf "$BUILD_DIR/tests"
            rm -rf "$BUILD_DIR/phpunit.xml.dist"
            rm -rf "$BUILD_DIR/composer.json"
            rm -rf "$BUILD_DIR/composer.lock"
            rm -rf "$BUILD_DIR/vendor"
            rm -rf "$BUILD_DIR/.git*"

            # Create the release ZIP package
            ZIP_NAME="$DIR-v$VERSION.zip"
            cd build_dir
            zip -r "../$ZIP_NAME" "$DIR"
            cd ..
            rm -rf "build_dir"

            # 2. Tag the repository and push to GitHub
            git tag "$TAG"
            git push origin "$TAG"

            # 3. Create the Release on GitHub using the built-in CLI
            FRIENDLY_NAME=$(echo "$DIR" | sed -r 's/-/ /g' | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}}1')
            RELEASE_NAME="$FRIENDLY_NAME v$VERSION"
            
            echo "📦 Publishing release and uploading $ZIP_NAME to GitHub..."
            gh release create "$TAG" "$ZIP_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Automated release of $FRIENDLY_NAME version $VERSION."

            # Clean up local release artifact
            rm "$ZIP_NAME"
          done
