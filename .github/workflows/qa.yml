name: QA Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-php:
    name: PHP Linting (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=plugins/gitsupport-engine/phpcs.xml.dist plugins/gitsupport-engine/

  build-and-test:
    name: Build & Test (PHPUnit & Playwright E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/gitsupport-engine/package.json

      - name: Start Docker Service
        run: sudo systemctl start docker || true

      - name: Install Node Dependencies
        working-directory: plugins/gitsupport-engine
        run: npm ci --legacy-peer-deps

      - name: Build Assets
        working-directory: plugins/gitsupport-engine
        run: npm run build

      - name: Start WordPress Environment (wp-env)
        working-directory: plugins/gitsupport-engine
        run: npm run env:start

      - name: Run PHPUnit Tests (via wp-env)
        working-directory: plugins/gitsupport-engine
        run: npm run test:phpunit

      - name: Install Playwright Browsers
        working-directory: plugins/gitsupport-engine
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: plugins/gitsupport-engine
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:8889

      - name: Stop WordPress Environment
        working-directory: plugins/gitsupport-engine
        if: always()
        run: npm run env:stop
